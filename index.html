<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D TECH</title>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #18B7BE;
      }

      #root {
        height: 100%;
      }
    </style>
  </head>

  <body style="margin: 0; background: #18B7BE;">
    <div
      id="initial-loader"
      style="
        position: fixed;
        inset: 0;
        z-index: 9999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #18B7BE;
      "
    >
      <img
        src="/Untitled design (1).png"
        alt="3D TECH"
        width="170"
        height="100"
        style="
          width: 170px;
          height: auto;
          object-fit: contain;
        "
      />
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      window.addEventListener('load', function () {
        const loader = document.getElementById('initial-loader');

        if (loader) {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 0.2s ease';

          setTimeout(function () {
            loader.remove();
          }, 200);
        }
      });
    </script>
  </body>
</html>
